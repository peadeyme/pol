name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with the version in the VERSION file"
        type: boolean
        default: false

permissions:
  contents: write

env:
  KEYSTORE_B64: ${{ secrets.POL_KEYSTORE_B64 }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version
        run: |
          echo "VERSION=$(tr -d ' \n' < VERSION)" >> $GITHUB_ENV

      - name: Decode release keystore (optional)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks

      - name: Build
        working-directory: android
        env:
          POL_KEYSTORE_PASSWORD: ${{ secrets.POL_KEYSTORE_PASSWORD }}
          POL_KEY_ALIAS: ${{ secrets.POL_KEY_ALIAS }}
          POL_KEY_PASSWORD: ${{ secrets.POL_KEY_PASSWORD }}
          POL_VERSION_CODE: ${{ github.run_number }}
          POL_VERSION_NAME: ${{ env.VERSION }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Pol.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pol-android
          path: Pol.apk

  ios:
    name: iOS IPA (unsigned, for SideStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          echo "VERSION=$(tr -d ' \n' < VERSION)" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Pol.xcodeproj \
            -scheme Pol \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$VERSION \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Pol.app Payload/
          zip -qry Pol.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pol-ios
          path: Pol.ipa

  # Publishes when the commit message contains [release], or from "Run workflow" with release ticked.
  release:
    name: Publish release
    if: >-
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.message, '[release]') || inputs.release)
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=$(tr -d ' \n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "**Pol.apk** — نصب روی گوشی اندروید (Android 10 به بالا)" \
            "**Pol.ipa** — نصب روی آیفون با SideStore (iOS 17 به بالا)" \
            "" \
            "خرید و تمدید اشتراک: https://t.me/polantenbot" > notes.md
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Pol.apk Pol.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Create the tag with git first; the releases API alone has been returning 500s.
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              git tag "v$VERSION" "$GITHUB_SHA"
              git push origin "v$VERSION"
            fi
            for i in 1 2 3 4 5; do
              gh release create "v$VERSION" Pol.apk Pol.ipa --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "Pol $VERSION" --notes-file notes.md --latest && exit 0
              sleep 15
            done
            exit 1
          fi
