name: Pol
options:
  bundleIdPrefix: ir.pedicode
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fa
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pol:
    type: application
    platform: iOS
    sources:
      - path: Pol
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.pedicode.pol
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Pol/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Pol/Info.plist
      properties:
        CFBundleDisplayName: پل
        CFBundleDevelopmentRegion: fa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: پل برای اتصال به گوشی اندروید شما از بلوتوث استفاده می‌کند.
        NSContactsUsageDescription: برای ذخیره‌ی مخاطبین گوشی اندروید در مخاطبین آیفون (اختیاری).
        LSApplicationQueriesSchemes:
          - sidestore
