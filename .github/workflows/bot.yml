name: Deploy bot

on:
  push:
    branches: [main]
    paths: ["bot/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip quietly until Cloudflare is set up.
    if: ${{ vars.BOT_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: KV namespace (create once)
        run: |
          find_id() { npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title.endsWith("pol-bot-db"));console.log(n?n.id:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create pol-bot-db >/dev/null; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/KV_ID/$ID/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy

      - name: Secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}
        run: |
          node -e 'const k=["BOT_TOKEN","LICENSE_KEY","WEBHOOK_SECRET","CARD_NUMBER","CARD_HOLDER"];const o={};for(const x of k){if(!process.env[x])throw new Error("missing secret "+x);o[x]=process.env[x]}require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
