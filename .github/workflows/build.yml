name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_B64: ${{ secrets.POL_KEYSTORE_B64 }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "VERSION=0.1.0" >> $GITHUB_ENV; fi

      - name: Decode release keystore (optional)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks

      - name: Build
        working-directory: android
        env:
          POL_KEYSTORE_PASSWORD: ${{ secrets.POL_KEYSTORE_PASSWORD }}
          POL_KEY_ALIAS: ${{ secrets.POL_KEY_ALIAS }}
          POL_KEY_PASSWORD: ${{ secrets.POL_KEY_PASSWORD }}
          POL_VERSION_CODE: ${{ github.run_number }}
          POL_VERSION_NAME: ${{ env.VERSION }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Pol.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pol-android
          path: Pol.apk

  ios:
    name: iOS IPA (unsigned, for SideStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "VERSION=0.1.0" >> $GITHUB_ENV; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Pol.xcodeproj \
            -scheme Pol \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$VERSION \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Pol.app Payload/
          zip -qry Pol.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pol-ios
          path: Pol.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Pol.apk
            Pol.ipa
